<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191b1e">
  <meta name="description" content="Move through a 3D reconstruction of real property footage.">
  <title>Vyral Spaces | 3D property tour</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="brand" href="./" aria-label="Vyral Spaces home"><span class="brand-icon" aria-hidden="true">V</span><span>Vyral <strong>Spaces</strong></span></a>
      <label class="property"><span>Property</span>
        <select id="property" aria-label="Property"></select>
      </label>
      <button class="share" id="share" type="button" title="Copy tour link" aria-label="Copy tour link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-2 2m2 6a4 4 0 0 0-6 0l-4 4a4 4 0 0 0 6 6l2-2"/></svg>
      </button>
    </header>
    <main id="viewer">
      <canvas id="scene" aria-label="Interactive three-dimensional property scan"></canvas>
      <div class="shade"></div>
      <section class="heading" aria-labelledby="name">
        <p class="caption">3D property scan</p>
        <h1 id="name">Vyral Spaces</h1>
        <p id="coverage"></p>
      </section>
      <div class="progress" id="progress" role="status"><span class="spinner"></span><span id="progress-text">Loading 3D scan…</span><button id="retry" type="button" hidden>Retry</button></div>
      <aside class="route" id="route-panel" aria-label="Camera route">
        <div class="route-head"><span>Scan path</span><span id="route-time"></span></div>
        <canvas id="map" width="168" height="103" aria-label="Top-down projection of the tracked camera path"></canvas>
      </aside>
      <div class="controls" id="controls">
        <div class="modes" role="group" aria-label="Viewing mode">
          <button id="walk" type="button" aria-pressed="true">Walk</button>
          <button id="orbit" type="button" aria-pressed="false">Orbit</button>
        </div>
        <button id="play" class="primary" type="button" aria-pressed="false"><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">Play tour</span></button>
        <button id="reset" type="button" aria-label="Reset view" title="Reset view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 3 8m-3-8V4m0 6h6"/></svg>
        </button>
        <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg>
        </button>
      </div>
      <div class="touch-controls" id="touch-controls" aria-label="Move along the scan">
        <button id="back" aria-label="Move back" type="button">↓</button>
        <button id="forward" aria-label="Move forward" type="button">↑</button>
      </div>
    </main>
    <footer>
      <span id="help">Drag to look · W/S to move through the scan · A/D to sidestep</span>
      <span id="notice" role="status"></span>
    </footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
