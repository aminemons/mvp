name: Reconstruct actual 3D from uploaded phone footage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/reconstruct.py"
      - ".github/workflows/reconstruct.yml"

permissions:
  contents: write

concurrency:
  group: reconstruction-main
  cancel-in-progress: false

jobs:
  cpu-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Vyral MVP
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install CPU reconstruction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends colmap ffmpeg
          colmap help | head -12
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2.3" "scipy>=1.12,<1.18" "opencv-python-headless>=4.10,<4.14" "onnxruntime>=1.19,<1.25"
      - name: Reconstruct camera poses and fuse CPU depth
        env:
          OMP_NUM_THREADS: "2"
        run: python scripts/reconstruct.py
      - name: Publish observed 3D geometry to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reconstruction/scene-a.json
          if git diff --cached --quiet; then
            echo "No change to scan asset"
          else
            git commit -m "Publish reconstructed point-cloud data [skip ci]"
            git push origin HEAD:main
          fi
